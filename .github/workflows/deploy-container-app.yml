name: Deploy OptiSweep AI to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CONTAINER_APP_NAME: optisweepai-troubleshooting-app
  RESOURCE_GROUP: optisweepai
  CONTAINER_APP_ENVIRONMENT: managedEnvironment-optisweepai-a18c
  AZURE_LOCATION: eastus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source deployment inputs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python scripts/preflight_deployment.py

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy source to Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ${{ vars.AZURE_ACR_NAME }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          location: ${{ env.AZURE_LOCATION }}
          runtimeStack: python:3.12
          ingress: external
          targetPort: 8501

      - name: Set source startup command
        run: >
          az containerapp update
          --name "${{ env.CONTAINER_APP_NAME }}"
          --resource-group "${{ env.RESOURCE_GROUP }}"
          --command "python"
          --args "scripts/start_azure_container_app.py"

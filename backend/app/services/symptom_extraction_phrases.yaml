# Phrase table for the deterministic keyword signal extractor.
#
# Each top-level key is a legacy signal key from
# `backend.app.schemas.assistant.INITIAL_CAT1_SIGNALS`. Each entry declares the
# affirmative phrases that imply the signal is True. Negation handling is
# applied automatically by the extractor: if the phrase appears inside a
# negation clause ("no AGV stopped", "without RMS alarm", "AGVs are not
# stopped") the signal is set to False rather than True.
#
# Keep phrases lowercase. Multi-word phrases are matched as substrings on
# the lowercased message after the negation pre-pass split.

agvs_stopped:
  - agv stopped
  - agvs stopped
  - agv are stopped
  - agvs are stopped
  - agv not moving
  - agvs not moving
  - agv is not moving
  - agvs are not moving
  - agvs aren't moving
  - agv isn't moving
  - aren't moving
  - are not moving
  - is not moving
  - nothing is moving
  - nothing moving
  - no movement
  - not moving
  - agvs halted
  - agv halted
  - agvs frozen
  - agvs idle

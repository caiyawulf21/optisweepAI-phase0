# Canonical-signal phrase table for the deterministic keyword extractor.
#
# Each top-level key is a CANONICAL signal id (a member of the canonical
# vocabulary derived from the procedure dictionary's
# relationship_tracking.{requires,produces,confirms,rules_out}_signals
# lists, OR a workflow node's branch.condition_signal). The extractor
# emits these into ``state['extracted_canonical_signals']`` so the router
# and the dynamic procedure selector can consume them WITHOUT going
# through the legacy alias map.
#
# Why this file exists separately from `symptom_extraction_phrases.yaml`:
# the legacy phrase table is pinned to the 13-key INITIAL_CAT1_SIGNALS
# vocabulary that downstream legacy code paths still depend on. Canonical
# signals are a strictly larger vocabulary and many of them only appear
# AFTER an operator answers a follow-up question (e.g.
# "service restart completed", "no e-stop fault", "tipper heartbeat is
# back to normal"). Adding those phrases to the legacy file would either
# break the 13-key contract or silently drop the canonical signal on the
# routing floor.
#
# Keep phrases lowercase. Negation handling is applied automatically by
# the extractor (``no e-stop fault`` flips ``e_stop_required`` to False).

